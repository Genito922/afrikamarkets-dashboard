version: "3.9"

# ── Afrika Markets Intelligence — Production (Alibaba Cloud ECS) ──────────────
# Architecture :
#   nginx     → reverse proxy HTTPS → api.yourdomain.com
#   fastapi   → backend Python (port 8080 interne)
#   db        → PostgreSQL 16 (ou pointer vers Alibaba RDS)
#
# Usage :
#   cp .env.prod.example .env.prod
#   # Editer .env.prod avec vos vraies valeurs
#   docker compose -f docker-compose.prod.yml up -d
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  fastapi:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ami_fastapi
    restart: unless-stopped
    env_file: .env.prod
    environment:
      PORT: "8080"
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ami_net
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: ami_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-afrika}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-afrikamarkets}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - ami_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-afrika}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Nginx reverse proxy + SSL ────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: ami_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro          # certificats Let's Encrypt
      - ./nginx/certbot:/var/www/certbot:ro    # challenge ACME
    depends_on:
      - fastapi
    networks:
      - ami_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:

networks:
  ami_net:
    driver: bridge
